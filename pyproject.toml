[project]
name = "artiary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "idna>=3.18",
    "prompt-toolkit>=3.0.52",
    "requests>=2.33.1",
    "ruamel-yaml>=0.19.1",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-json-report>=1.5.0",
    "radon>=6.0",
    "pip-audit>=2.9",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F841", "F401"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.radon]
exclude = ["update-versions.py"]

[tool.coverage.report]
fail_under = 0
