image:
  base: "node:24-trixie"
npm:
  - "playwright"
  - "@charmland/crush"
  - "@google/gemini-cli"
  - "@openai/codex"
  - "@quasar/cli"
  - "@qwen-code/qwen-code"
  - "eslint"
  - "opencode-ai"
  - "prettier"
  - "typescript"
  - "@kilocode/cli"
pip:
  - "black"
  - "flake8"
  - "mypy"
  - "playwright"
  - "pytest"
  - "ruff"
scripts:
  claude:
    url: "https://downloads.claude.ai/claude-code-releases/${version}/linux-x64/claude"
  gh:
    url: "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz"
  copilot:
    url: "https://github.com/github/copilot-cli/releases/download/v${version}/copilot-linux-x64.tar.gz"
  factory-droid:
    url: "https://downloads.factory.ai/factory-cli/releases/${version}/linux/x64/droid"
  goose:
    url: "https://github.com/aaif-goose/goose/releases/download/v${version}/goose-x86_64-unknown-linux-gnu.tar.gz"
  jq:
    url: "https://github.com/jqlang/jq/releases/download/jq-${version}/jq-linux-amd64"
  kimi:
    build: "builders/kimi/build.sh"
    artifact: "kimi-cli-offline.tar.gz"
  playwright-chromium:
    build: "builders/playwright/build.sh"
    artifact: "playwright-chromium-offline.tar.gz"
  mistral:
    build: "builders/mistral/build.sh"
    artifact: "mistral-vibe-offline.tar.gz"
  yarn:
    url: "https://repo.yarnpkg.com/${version}/packages/yarnpkg-cli/bin/yarn.js"
  yq:
    url: "https://github.com/mikefarah/yq/releases/download/v${version}/yq_linux_amd64"
